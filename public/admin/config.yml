                  - primary
          - name: gallery
            label: Galleria
            widget: object
            hint: "Le foto dei lavori svolti: una griglia che si ingrandisce al clic, coppie prima e dopo, oppure una foto grande alla volta."
            summary: "{{fields.title}}"
            fields:
              - name: variant
                label: Variante
                hint: "griglia-popup: miniature che si ingrandiscono al clic · prima-dopo: coppie di foto da confrontare · slider: una foto grande alla volta"
                widget: select
                options:
                  - griglia-popup
                  - prima-dopo
                  - slider
              - name: eyebrow
                label: Occhiello
                hint: Breve testo sopra il titolo
                required: false
                widget: string
                pattern:
                  - ^[\s\S]{1,40}$
                  - al massimo 40 caratteri
              - name: title
                label: Titolo
                hint: Al massimo 70 caratteri
                widget: string
                pattern:
                  - ^[\s\S]{1,70}$
                  - al massimo 70 caratteri
              - name: intro
                label: Introduzione
                hint: Al massimo 240 caratteri
                required: false
                widget: text
                pattern:
                  - ^[\s\S]{1,240}$
                  - al massimo 240 caratteri
              - name: items
                label: Foto
                hint: Da 2 a 12, solo foto reali
                widget: list
                fields:
                  - name: image
                    label: Foto
                    hint: Solo foto reali dei lavori; nel prima-dopo è la foto «dopo»
                    widget: object
                    collapsed: false
                    fields:
                      - name: src
                        label: File
                        hint: JPG, PNG o WebP; per le foto grandi almeno 1600 px di larghezza
                        widget: image
                        choose_url: false
                      - name: alt
                        label: Testo alternativo
                        hint: Descrive la foto a chi non la vede, es. «Banco da lavoro con gli attrezzi appesi alla parete»
                        widget: string
                        pattern:
                          - ^[\s\S]{5,}$
                          - almeno 5 caratteri
                  - name: before
                    label: Foto «prima»
                    hint: Obbligatoria per la variante prima-dopo, stessa inquadratura del «dopo»
                    required: false
                    widget: object
                    collapsed: true
                    fields:
                      - name: src
                        label: File
