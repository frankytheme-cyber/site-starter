# Controlli automatici: docs/controlli.md.
# - check: suite "check" (statici + build) sulle pull request, sui push su main e a mano.
# - qa: sulle pull request (e a mano), dopo check: link, accessibilità, interattivi, Lighthouse.
# - template-as-site: solo nella libreria, sulle pull request (e a mano), dopo check: il template,
#   copiato e inizializzato come sito cliente, deve fallire qa --strict solo per i segnaposto attesi.
# Sulle pull request verso main check e qa usano --strict (regole di pubblicazione).
# Modalità (src/core/mode.ts): la variabile del repository SITE_STARTER_LIBRARY vale 1 solo nella
# libreria site-starter (Settings → Secrets and variables → Actions → Variables); nei siti cliente
# non c'è e arriva vuota, cioè modalità sito (docs/siti-cliente.md). template-as-site la svuota.
name: CI

# Push solo su main: un branch con una pull request aperta gira una volta sola, come pull request,
# e non anche per il push dello stesso commit. Un branch senza pull request si prova a mano
# (Actions → CI → Run workflow) o aprendo una pull request in bozza.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Il token del workflow legge soltanto: nessun job scrive nel repository.
permissions:
  contents: read

# Una sola esecuzione per branch: un push nuovo annulla quella in corso (pull request comprese,
# raggruppate per il branch di partenza).
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Versioni delle azioni: l'ultima maggiore di ognuna, tutte su Node 24 (runs.using: node24). Le
# azioni su Node 20 sono deprecate sui runner di GitHub.

env:
  # Tutti i job: 1 nella libreria, vuota nei siti cliente.
  SITE_STARTER_LIBRARY: ${{ vars.SITE_STARTER_LIBRARY }}
  STRICT_FLAG: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && '--strict' || '' }}
  # Repo per la configurazione di Decap (scripts/gen-decap-config.ts).
  DECAP_REPO: ${{ github.repository }}

jobs:
  check:
    name: check
    # Runner fissato, non ubuntu-latest: dal 19 ottobre 2026 ubuntu-latest passa a Ubuntu 26.04, e
    # con un'altra immagine cambiano da un giorno all'altro pacchetti di sistema e font, quindi le
    # misure di Lighthouse (CLS) e di axe. Il passaggio a una versione nuova si fa qui, su una pull
    # request, per tutti e tre i job insieme.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: npm run check ${{ env.STRICT_FLAG }}
        run: npm run check -- $STRICT_FLAG

      - name: Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-check
          path: reports/
          if-no-files-found: ignore

  qa:
    name: qa
    if: github.event_name != 'push'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Versione di Playwright
        id: playwright
        run: echo "version=$(node -p 'require("playwright/package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Cache dei browser di Playwright
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Chromium e dipendenze di sistema
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Solo dipendenze di sistema (Chromium dalla cache)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: npm run qa ${{ env.STRICT_FLAG }}
        run: npm run qa -- $STRICT_FLAG

      # Il motivo del fallimento nel log e come annotazioni ::error: si legge su GitHub senza
      # scaricare reports-qa (scripts/checks/ci-summary.ts).
      - name: Motivo del fallimento
        if: failure()
        run: node scripts/checks/ci-summary.ts reports/qa.json

      - name: Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-qa
          path: reports/
          if-no-files-found: ignore

  template-as-site:
    name: template-as-site
    # Parte solo nella libreria (la condizione legge vars, non l'ambiente del job), ma gira da sito
    # cliente: la variabile vuota dà la modalità sito anche allo script che prepara la copia.
    if: vars.SITE_STARTER_LIBRARY == '1' && github.event_name != 'push'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SITE_STARTER_LIBRARY: ""
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Versione di Playwright
        id: playwright
        run: echo "version=$(node -p 'require("playwright/package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Cache dei browser di Playwright
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Chromium e dipendenze di sistema
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Solo dipendenze di sistema (Chromium dalla cache)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Copia in una cartella temporanea, senza SITE_STARTER_LIBRARY né DECAP_REPO: site:init e
      # qa --strict, che deve fallire esclusivamente per DA-COMPILARE e og-DA-COMPILARE.
      - name: Template come sito cliente
        run: npm run check:template

      # Come in qa; qui i segnaposto sono attesi e restano solo nel log.
      - name: Motivo del fallimento
        if: failure()
        run: node scripts/checks/ci-summary.ts reports/template-as-site/qa.json --placeholders-expected

      - name: Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-template-as-site
          path: reports/template-as-site/
          if-no-files-found: ignore
