          - name: testimonials
            label: Recensioni
            widget: object
            hint: "Le parole dei clienti: recensioni vere con autore e fonte, in griglia, una sola in evidenza o da sfogliare."
            summary: "{{fields.title}}"
            fields:
              - name: variant
                label: Variante
                hint: "cards: recensioni in griglia · singola: una sola recensione in evidenza · slider: recensioni che si sfogliano"
                widget: select
                options:
                  - cards
                  - singola
                  - slider
              - name: eyebrow
                label: Occhiello
                hint: Breve testo sopra il titolo
                required: false
                widget: string
                pattern:
                  - ^[\s\S]{1,40}$
                  - al massimo 40 caratteri
              - name: title
                label: Titolo
                hint: Al massimo 70 caratteri
                widget: string
                pattern:
                  - ^[\s\S]{1,70}$
                  - al massimo 70 caratteri
              - name: items
                label: Recensioni
                hint: Solo recensioni reali, ognuna con la sua fonte
                widget: list
                fields:
                  - name: quote
                    label: Recensione
                    hint: Le parole del cliente, copiate senza cambiarle, al massimo 400 caratteri
                    widget: text
                    pattern:
                      - ^[\s\S]{10,400}$
                      - tra 10 e 400 caratteri
                  - name: author
                    label: Autore
                    hint: Come firma la recensione, es. «Marco R.»
                    widget: string
                    pattern:
                      - ^[\s\S]{1,60}$
                      - al massimo 60 caratteri
                  - name: role
                    label: Chi è
                    hint: Facoltativo, es. «cliente da 5 anni»
                    required: false
                    widget: string
                    pattern:
                      - ^[\s\S]{1,60}$
                      - al massimo 60 caratteri
                  - name: rating
                    label: Stelle
                    hint: Facoltativo, da 1 a 5, solo se la recensione le riporta
                    required: false
                    widget: number
                    value_type: float
                  - name: fonte
                    label: Fonte
                    hint: "Obbligatoria: dove è stata scritta, es. «Google, marzo 2025» o «messaggio WhatsApp»"
                    widget: string
                    pattern:
                      - ^[\s\S]{2,60}$
                      - tra 2 e 60 caratteri
                  - name: href
                    label: Link alla recensione
                    hint: Facoltativo, indirizzo completo della recensione originale
                    required: false
                    widget: string
                    pattern:
                      - ^https://\S+$
                      - un indirizzo completo che inizia con https://
                min: 1
                max: 10
                collapsed: false
              - name: id
                label: Ancora
