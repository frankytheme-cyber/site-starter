              - name: image
                label: Foto
                hint: Obbligatoria per le varianti split e full
                required: false
                widget: object
                collapsed: true
                fields:
                  - name: src
                    label: File
                    hint: JPG, PNG o WebP; per le foto grandi almeno 1600 px di larghezza
                    required: false
                    widget: image
                    choose_url: false
                  - name: alt
                    label: Testo alternativo
                    hint: Descrive la foto a chi non la vede, es. «Banco da lavoro con gli attrezzi appesi alla parete»
                    required: false
                    widget: string
                    pattern:
                      - ^[\s\S]{5,}$
                      - almeno 5 caratteri
              - name: id
                label: Ancora
                hint: "Nome della sezione per i link (#nome): minuscole, cifre e trattini"
                required: false
                widget: string
                pattern:
                  - ^[a-z0-9]+(?:-[a-z0-9]+)*$
                  - id in kebab-case, solo minuscole, cifre e trattini (es. "preventivo-gratuito")
              - name: tone
                label: Sfondo
                hint: "default: chiaro · muted: tenue · primary: colore principale. Alterna gli sfondi tra sezioni vicine"
                required: false
                default: default
                widget: select
                options:
                  - default
                  - muted
                  - primary
          - name: accordion
            label: Accordion
            widget: object
            hint: "Domande frequenti o sezioni di testo che si aprono una per una: tanti contenuti in poco spazio."
            summary: "{{fields.title}}"
            fields:
              - name: variant
                label: Variante
                hint: "faq: domande e risposte, segnalate anche a Google · contenuti: sezioni di testo da aprire, accanto al titolo"
                widget: select
                options:
                  - faq
                  - contenuti
              - name: eyebrow
                label: Occhiello
                hint: Breve testo sopra il titolo
                required: false
                widget: string
              - name: title
                label: Titolo
                hint: Al massimo 70 caratteri
                widget: string
                pattern:
                  - ^[\s\S]{1,70}$
                  - al massimo 70 caratteri
              - name: intro
                label: Introduzione
                hint: Al massimo 240 caratteri
                required: false
                widget: text
                pattern:
                  - ^[\s\S]{1,240}$
                  - al massimo 240 caratteri
              - name: items
                label: Voci
                hint: Da 2 a 12
                widget: list
                fields:
                  - name: title
                    label: Domanda o titolo
                    hint: Al massimo 120 caratteri
                    widget: string
                    pattern:
                      - ^[\s\S]{1,120}$
                      - al massimo 120 caratteri
                  - name: text
                    label: Risposta o testo
                    hint: Al massimo 1200 caratteri; una riga vuota separa i paragrafi
                    widget: text
                    pattern:
                      - ^[\s\S]{1,1200}$
                      - al massimo 1200 caratteri
                min: 2
                max: 12
                collapsed: false
              - name: single
                label: Una alla volta
                hint: Aprendo una voce si chiudono le altre
                required: false
                default: false
                widget: boolean
              - name: id
                label: Ancora
                hint: "Nome della sezione per i link (#nome): minuscole, cifre e trattini"
                required: false
                widget: string
                pattern:
                  - ^[a-z0-9]+(?:-[a-z0-9]+)*$
                  - id in kebab-case, solo minuscole, cifre e trattini (es. "preventivo-gratuito")
              - name: tone
                label: Sfondo
                hint: "default: chiaro · muted: tenue · primary: colore principale. Alterna gli sfondi tra sezioni vicine"
                required: false
                default: default
                widget: select
                options:
                  - default
                  - muted
                  - primary
          - name: carousel
            label: Carosello
            widget: object
            hint: Una fila di foto o di card che si scorre in orizzontale, col dito o con le frecce. Non scorre mai da sola.
            summary: "{{fields.title}}"
            fields:
              - name: variant
                label: Variante
                hint: "immagini: foto grandi con didascalia · immagini-testo: foto, titolo, testo e link per ogni elemento"
                widget: select
                options:
                  - immagini
                  - immagini-testo
              - name: eyebrow
                label: Occhiello
                hint: Breve testo sopra il titolo
                required: false
                widget: string
              - name: title
                label: Titolo
                hint: Al massimo 70 caratteri
                widget: string
                pattern:
                  - ^[\s\S]{1,70}$
                  - al massimo 70 caratteri
              - name: intro
                label: Introduzione
                hint: Al massimo 240 caratteri
                required: false
                widget: text
                pattern:
                  - ^[\s\S]{1,240}$
                  - al massimo 240 caratteri
              - name: items
                label: Elementi
                hint: Da 3 a 12
                widget: list
                fields:
                  - name: image
                    label: Foto
                    hint: JPG, PNG o WebP
                    widget: object
                    collapsed: false
                    fields:
                      - name: src
                        label: File
                        hint: JPG, PNG o WebP; per le foto grandi almeno 1600 px di larghezza
                        widget: image
                        choose_url: false
                      - name: alt
                        label: Testo alternativo
                        hint: Descrive la foto a chi non la vede, es. «Banco da lavoro con gli attrezzi appesi alla parete»
                        widget: string
                        pattern:
                          - ^[\s\S]{5,}$
                          - almeno 5 caratteri
                  - name: title
                    label: Titolo
                    hint: Obbligatorio per la variante immagini-testo; in immagini è la didascalia
                    required: false
                    widget: string
                    pattern:
                      - ^[\s\S]{1,60}$
                      - al massimo 60 caratteri
                  - name: text
                    label: Testo
                    hint: Obbligatorio per la variante immagini-testo, al massimo 200 caratteri
                    required: false
                    widget: text
                    pattern:
                      - ^[\s\S]{1,200}$
                      - al massimo 200 caratteri
                  - name: cta
                    label: Link
                    hint: Facoltativo, solo nella variante immagini-testo
                    required: false
                    widget: object
                    collapsed: true
                    fields:
                      - name: label
                        label: Testo del pulsante
                        hint: Al massimo 25 caratteri
                        required: false
                        widget: string
                        pattern:
                          - ^[\s\S]{1,25}$
                          - al massimo 25 caratteri
                      - name: href
                        label: Link
                        hint: Una pagina del sito (/contatti/), una sezione (#preventivo), un indirizzo completo, oppure @telefono, @whatsapp, @email o @mappa per i recapiti di «Dati attività»
                        required: false
                        widget: string
                        pattern:
                          - ^(?:@telefono|@whatsapp|@email|@mappa|[^@\s]\S*)$
                          - "un link (/pagina/, #sezione, https://...) oppure @telefono, @whatsapp, @email, @mappa"
