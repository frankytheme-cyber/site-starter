        collapsed: true
  - name: site
    label: Dati attività
    description: "Nome, recapiti, indirizzo, orari e dati legali: compaiono in tutto il sito."
    editor:
      preview: false
    files:
      - name: site
        label: Dati attività
        file: src/content/settings/site.json
        media_folder: ../../assets/images
        public_folder: ../../assets/images
        fields:
          - name: businessName
            label: Nome dell’attività
            hint: Come compare sul sito e su Google
            widget: string
          - name: description
            label: Descrizione dell’attività
            hint: "Una frase su cosa fa e dove: compare nel footer e su Google, al massimo 160 caratteri"
            widget: text
            pattern:
              - ^[\s\S]{1,160}$
              - al massimo 160 caratteri
          - name: url
            label: Indirizzo del sito
            hint: Completo, es. https://www.esempio.it
            widget: string
            pattern:
              - ^https://\S+$
              - un indirizzo completo che inizia con https://
          - name: logo
            label: Logo
            hint: PNG o WebP con sfondo trasparente, almeno 400 px di larghezza
            required: false
            widget: image
            choose_url: false
          - name: defaultOgImage
            label: Immagine per i social
            hint: Compare quando una pagina del sito viene condivisa, se la pagina non ne ha una sua; JPG orizzontale, almeno 1200×630 px
            required: false
            widget: image
            choose_url: false
          - name: phone
            label: Telefono
            hint: Come va mostrato, es. 051 123 4567
            widget: string
            pattern:
              - ^\+?\d[\d\s./-]{4,18}\d$
              - numero di telefono non valido (es. "051 123 4567")
          - name: whatsapp
            label: WhatsApp
            hint: Con il prefisso internazionale, es. +39 333 123 4567; lascia vuoto se non lo usi
            required: false
            widget: string
            pattern:
              - ^\+\d[\d\s]{6,18}\d$
              - numero WhatsApp con prefisso internazionale (es. "+39 333 123 4567")
          - name: email
            label: Email
            hint: Indirizzo a cui scrivere, es. info@esempio.it
            widget: string
            pattern:
              - ^[^\s@]+@[^\s@]+\.[^\s@]+$
              - un indirizzo email, es. info@esempio.it
          - name: address
            label: Indirizzo
            hint: Sede dell’attività
            widget: object
            collapsed: false
            fields:
              - name: street
                label: Via e numero civico
                hint: Es. Via Roma 12
                widget: string
              - name: postalCode
                label: CAP
                hint: 5 cifre, es. 40121
                widget: string
                pattern:
                  - ^\d{5}$
                  - CAP di 5 cifre
              - name: city
                label: Comune
                hint: Es. Bologna
                widget: string
              - name: province
                label: Provincia
                hint: Sigla in maiuscolo, es. BO
                widget: string
                pattern:
                  - ^[A-Z]{2}$
                  - sigla della provincia in maiuscolo (es. "BO")
          - name: legalName
            label: Ragione sociale
            hint: "Il nome registrato in Camera di commercio, forma giuridica compresa: es. «Bottega Esempio S.r.l.» o «Bottega Esempio di Mario Rossi»"
            widget: string
            pattern:
              - ^[\s\S]{1,120}$
              - al massimo 120 caratteri
          - name: legalForm
            label: Forma giuridica
            hint: Per S.r.l., S.r.l.s., S.n.c. e S.a.s. compila anche REA e capitale sociale
            widget: select
            options:
              - label: Ditta individuale
                value: ditta-individuale
              - label: S.r.l.
                value: srl
              - label: S.r.l.s.
                value: srls
              - label: S.n.c.
                value: snc
              - label: S.a.s.
                value: sas
              - label: Altro
                value: altro
          - name: vatNumber
            label: Partita IVA
            hint: 11 cifre, senza IT davanti
            widget: string
            pattern:
              - ^\d{11}$
              - partita IVA di 11 cifre, senza IT davanti
          - name: rea
            label: Numero REA
            hint: Sigla della provincia e numero, es. BO-123456; obbligatorio per le società
            required: false
            widget: string
            pattern:
              - ^[A-Z]{2}[- ]?\d{1,7}$
              - sigla della provincia e numero, es. BO-123456
          - name: shareCapital
            label: Capitale sociale
            hint: "Quello versato, come va mostrato: es. 10.000 € i.v.; obbligatorio per le società"
            required: false
            widget: string
            pattern:
              - (?=^[\s\S]{0,40}$)(?=^\D*\d)
              - al massimo 40 caratteri; indica l’importo, es. 10.000 € i.v.
          - name: openingHours
            label: Orari
            hint: Una riga per gruppo di giorni con lo stesso orario; aggiungi una riga senza fasce per i giorni di chiusura
            widget: list
            fields:
              - name: days
                label: Giorni
                hint: Tutti i giorni che hanno questo orario, es. da lunedì a venerdì
                widget: select
                multiple: true
                options:
                  - label: Lunedì
                    value: lun
                  - label: Martedì
                    value: mar
                  - label: Mercoledì
                    value: mer
                  - label: Giovedì
                    value: gio
                  - label: Venerdì
                    value: ven
                  - label: Sabato
                    value: sab
                  - label: Domenica
                    value: dom
                min: 1
              - name: slots
                label: Fasce orarie
                hint: Una per ogni apertura della giornata, es. mattina e pomeriggio; nessuna fascia = chiuso
                required: false
                default: []
                widget: list
                fields:
                  - name: opens
                    label: Apre alle
                    hint: Es. 08:30
                    widget: string
                    pattern:
                      - ^(?:[01]\d|2[0-3]):[0-5]\d$
                      - ora nel formato 08:30, da 00:00 a 23:59
                  - name: closes
                    label: Chiude alle
                    hint: Es. 12:30
                    widget: string
                    pattern:
                      - ^(?:[01]\d|2[0-3]):[0-5]\d$
                      - ora nel formato 08:30, da 00:00 a 23:59
                max: 3
                collapsed: true
            min: 1
            max: 7
            collapsed: false
          - name: social
            label: Profili social
            hint: Lascia vuoti quelli che non usi
            required: false
            widget: object
            collapsed: true
            fields:
              - name: facebook
                label: Facebook
                hint: Indirizzo completo della pagina
                required: false
                widget: string
                pattern:
                  - ^https://\S+$
                  - un indirizzo completo che inizia con https://
              - name: instagram
                label: Instagram
                hint: Indirizzo completo del profilo
                required: false
                widget: string
                pattern:
                  - ^https://\S+$
                  - un indirizzo completo che inizia con https://
              - name: google
                label: Google
                hint: Indirizzo della scheda Google dell’attività
                required: false
                widget: string
                pattern:
                  - ^https://\S+$
                  - un indirizzo completo che inizia con https://
              - name: youtube
                label: YouTube
                hint: Indirizzo completo del canale
                required: false
                widget: string
                pattern:
                  - ^https://\S+$
                  - un indirizzo completo che inizia con https://
              - name: tiktok
                label: TikTok
                hint: Indirizzo completo del profilo
                required: false
                widget: string
                pattern:
                  - ^https://\S+$
