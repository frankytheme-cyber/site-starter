                  - name: image
                    label: Foto
                    hint: Obbligatoria per le varianti cards-immagine e alternato; facoltativa nelle schede
                    required: false
                    widget: object
                    collapsed: true
                    fields:
                      - name: src
                        label: File
                        hint: JPG, PNG o WebP; per le foto grandi almeno 1600 px di larghezza
                        required: false
                        widget: image
                        choose_url: false
                      - name: alt
                        label: Testo alternativo
                        hint: Descrive la foto a chi non la vede, es. «Banco da lavoro con gli attrezzi appesi alla parete»
                        required: false
                        widget: string
                        pattern:
                          - ^[\s\S]{5,}$
                          - almeno 5 caratteri
                  - name: title
                    label: Nome del servizio
                    hint: Al massimo 50 caratteri
                    widget: string
                    pattern:
                      - ^[\s\S]{1,50}$
                      - al massimo 50 caratteri
                  - name: text
                    label: Descrizione
                    hint: Cosa comprende il servizio, al massimo 180 caratteri
                    widget: text
                    pattern:
                      - ^[\s\S]{1,180}$
                      - al massimo 180 caratteri
                  - name: link
                    label: Link
                    hint: "Porta alla pagina o alla sezione del servizio: compila testo e link, oppure nessuno dei due"
                    required: false
                    widget: object
                    collapsed: true
                    fields:
                      - name: label
                        label: Testo del pulsante
                        hint: Al massimo 25 caratteri
                        required: false
                        widget: string
                        pattern:
                          - ^[\s\S]{1,25}$
                          - al massimo 25 caratteri
                      - name: href
                        label: Link
                        hint: Una pagina del sito (/contatti/), una sezione (#preventivo), un indirizzo completo, oppure @telefono, @whatsapp, @email o @mappa per i recapiti di «Dati attività»
                        required: false
                        widget: string
                        pattern:
                          - ^(?:@telefono|@whatsapp|@email|@mappa|[^@\s]\S*)$
                          - "un link (/pagina/, #sezione, https://...) oppure @telefono, @whatsapp, @email, @mappa"
                      - name: style
                        label: Stile
                        hint: "primary: pieno · secondary: bordato · ghost: solo testo · link: sottolineato. Vuoto: quello previsto dal blocco"
                        required: false
                        widget: select
                        options:
                          - primary
                          - secondary
                          - ghost
                          - link
