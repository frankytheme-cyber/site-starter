# Generato da scripts/gen-decap-config.ts (npm run gen:decap): non modificare a mano.
# I campi vengono dagli schemi Zod di blocchi, pagine e impostazioni.
backend:
  name: github
  repo: frankytheme-cyber/site-starter
  branch: main
  base_url: https://decap-oauth.da-compilare.workers.dev
  auth_endpoint: auth
  commit_messages:
    create: Crea {{collection}} «{{slug}}»
    update: Aggiorna {{collection}} «{{slug}}»
    delete: Elimina {{collection}} «{{slug}}»
    uploadMedia: Carica «{{path}}»
    deleteMedia: Elimina «{{path}}»
local_backend: true
publish_mode: editorial_workflow
locale: it
site_url: https://da-compilare.example.com
display_url: https://da-compilare.example.com
media_folder: src/assets/images
public_folder: /src/assets/images
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"
editor:
  preview: false
collections:
  - name: pages
    label: Pagine
    label_singular: Pagina
    description: "Le pagine del sito: ogni pagina è un elenco di sezioni. La home è «index»."
    folder: src/content/pages
    extension: json
    format: json
    create: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}}"
    media_folder: ../../assets/images
    public_folder: ../../assets/images
    editor:
      preview: false
    fields:
      - name: $schema
        widget: hidden
        default: ../../../.astro/collections/pages.schema.json
      - name: title
        label: Titolo della pagina
        hint: Compare nella scheda del browser e su Google, al massimo 60 caratteri
        widget: string
        pattern:
          - ^[\s\S]{1,60}$
          - al massimo 60 caratteri
      - name: description
        label: Descrizione
        hint: Il testo sotto il titolo nei risultati di Google, al massimo 160 caratteri
        widget: text
        pattern:
          - ^[\s\S]{1,160}$
          - al massimo 160 caratteri
      - name: draft
        label: Bozza
        hint: Una bozza non compare sul sito pubblicato
        required: false
        default: false
        widget: boolean
      - name: ogImage
        label: Immagine per i social
        hint: Compare quando la pagina viene condivisa; viene ritagliata a 1200×630
        required: false
        widget: image
        choose_url: false
      - name: noindex
        label: Nascondi ai motori di ricerca
        hint: Solo per pagine che non devono comparire su Google
        required: false
        widget: boolean
      - name: sections
        label: Sezioni
        hint: I blocchi della pagina, dall’alto in basso
        widget: list
        typeKey: type
        types:
          - name: hero
            label: Hero
            widget: object
            hint: "Apertura della pagina: titolo principale, sottotitolo e invito all’azione."
            summary: "{{fields.title}}"
            fields:
              - name: variant
                label: Variante
                hint: "split: testo e foto affiancati · full: foto a tutta larghezza · centered: solo testo"
                widget: select
                options:
                  - split
                  - full
                  - centered
              - name: eyebrow
                label: Occhiello
                hint: Breve testo sopra il titolo, es. il settore
                required: false
                widget: string
              - name: title
                label: Titolo
                hint: Il titolo principale della pagina, al massimo 70 caratteri
                widget: string
                pattern:
                  - ^[\s\S]{1,70}$
                  - al massimo 70 caratteri
              - name: subtitle
                label: Sottotitolo
                hint: Una o due frasi su cosa offri, al massimo 200 caratteri
                required: false
                widget: text
                pattern:
                  - ^[\s\S]{1,200}$
                  - al massimo 200 caratteri
              - name: primaryCta
                label: Pulsante principale
                hint: L’azione più importante, es. «Chiedi un preventivo»
                widget: object
                collapsed: false
                fields:
                  - name: label
                    label: Testo del pulsante
                    hint: Al massimo 25 caratteri
                    widget: string
                    pattern:
                      - ^[\s\S]{1,25}$
                      - al massimo 25 caratteri
                  - name: href
                    label: Link
                    hint: Una pagina del sito (/contatti/), una sezione (#preventivo), un indirizzo completo, oppure @telefono, @whatsapp, @email o @mappa per i recapiti di «Dati attività»
                    widget: string
                    pattern:
                      - ^(?:@telefono|@whatsapp|@email|@mappa|[^@\s]\S*)$
                      - "un link (/pagina/, #sezione, https://...) oppure @telefono, @whatsapp, @email, @mappa"
                  - name: style
                    label: Stile
                    hint: "primary: pieno · secondary: bordato · ghost: solo testo · link: sottolineato. Vuoto: quello previsto dal blocco"
                    required: false
                    widget: select
                    options:
                      - primary
                      - secondary
                      - ghost
                      - link
                  - name: icon
                    label: Icona
                    hint: Facoltativa, accanto al testo (le frecce vanno dopo il testo)
                    required: false
                    widget: select
                    options:
                      - pennello
                      - rullo
                      - secchio-vernice
                      - casa
                      - edificio
                      - scala
                      - muro
                      - goccia
                      - scudo
                      - check
                      - stella
                      - orologio
                      - calendario
                      - telefono
                      - email
